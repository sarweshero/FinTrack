<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>FinPulse - Personal Finance</title>
    <meta name="description" content="Mobile-first personal finance tracker with automated ledger, two-way debt reminders, and Gemini AI reports." />

    <!-- Favicon & Brand Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/icon-96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Mobile Standalone PWA Support (iOS & Android) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinPulse" />
    <meta name="application-name" content="FinPulse" />

    <!-- Color Scheme & Theme Color -->
    <meta name="theme-color" content="#060813" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#060813" />
    <meta name="color-scheme" content="dark" />
    <meta name="msapplication-TileColor" content="#060813" />
    <meta name="msapplication-TileImage" content="/icons/icon-192.png" />
  </head>
  <body class="bg-[#060813] text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
