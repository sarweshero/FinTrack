<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24" />
      <stop offset="50%" stop-color="#060813" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>
    
    <linearGradient id="pulseGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Ambient glow circle -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" filter="url(#softGlow)" />

  <!-- Subtle border highlight -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" />

  <!-- Inner subtle grid lines -->
  <line x1="96" y1="256" x2="416" y2="256" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2" stroke-dasharray="6,8" />
  <line x1="96" y1="176" x2="416" y2="176" stroke="rgba(255, 255, 255, 0.03)" stroke-width="2" stroke-dasharray="6,8" />
  <line x1="96" y1="336" x2="416" y2="336" stroke="rgba(255, 255, 255, 0.03)" stroke-width="2" stroke-dasharray="6,8" />

  <!-- Glowing Trend Area Fill -->
  <path d="M 96 320 L 160 320 L 210 240 L 260 290 L 330 160 L 416 160 L 416 350 L 96 350 Z" 
        fill="url(#pulseGrad)" 
        opacity="0.12" />

  <!-- Main FinPulse dynamic line -->
  <path d="M 88 320 L 155 320 L 210 240 L 260 295 L 340 160 L 416 160" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neonGlow)" />

  <!-- Growth Arrowhead -->
  <path d="M 378 122 L 424 160 L 378 198" 
        fill="none" 
        stroke="#a855f7" 
        stroke-width="22" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neonGlow)" />

  <!-- Glowing Peak Node -->
  <circle cx="340" cy="160" r="14" fill="#ffffff" filter="url(#neonGlow)" />
  <circle cx="340" cy="160" r="7" fill="#6366f1" />

  <!-- Start Point Node -->
  <circle cx="96" cy="320" r="8" fill="#38bdf8" />
</svg>

